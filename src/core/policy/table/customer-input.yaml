# C · Customer input
#
# A typo. The highest-recovery class in the taxonomy: intent is proven, the fix
# takes seconds, and the customer is very often still on the page.
#
# The only rule that matters here is SPEED. Intent decays in minutes. A ladder
# that opens at 30 minutes has already lost most of what it could have
# recovered. This is the one class whose floor is zero.
#
# ── one rung, both channels ──
#
# WhatsApp AND email go out together at 0m, on a single `fanout: true` rung.
#
# This was two rungs — WhatsApp at 0m, email at 5m — and the intent behind that
# was always belt-and-braces: tell them on WhatsApp and put the same link in
# their inbox while they still care. It did not work, for a reason that is
# structural rather than a matter of tuning the offset.
#
# A second rung is a SECOND GATE EVALUATION. Everything the gate is entitled to
# defer on applies again: the live-attempt lock (`live_attempt_lock_minutes`,
# 3 on this account), the cool-off (`min_gap_minutes`), quiet hours. So the
# email did not arrive five minutes later — it arrived whenever the gate next
# let it through, observed in production at about three minutes and capable of
# being much longer. A pair that arrives minutes apart is not a pair; it is a
# first message and a nag.
#
# On one rung there is one gate decision. Deferral can still move the pair —
# quiet hours are quiet hours — but it can no longer SPLIT it. Either both go
# or neither does, which is the behaviour the two-rung version was reaching for.
#
# Each channel still writes its own `message_log` row and its own idempotency
# key, so the ledger remains truthful about how many messages a person got, and
# `compile.ts` counts this rung as two against `maxMessages` and the class
# ceiling rather than as one.
#
# ── the cost, stated plainly ──
#
# The per-person daily cap counts MESSAGES, not rungs, so this pair spends TWO
# slots at once. On the default `frequency_cap_per_day` of 2 the pair is that
# person's entire budget for the day, and any other live case for them will
# defer until the window rolls.
#
# That is the honest accounting — they did receive two messages — and it is the
# thing to check before adding a third rung here: on a default account the third
# rung would defer rather than fire, and the deferral would look like a timing
# problem rather than a budget one. Raise `frequency_cap_per_day` deliberately
# if this class is ever extended.
#
# ── why email, not sms ──
#
# There is no SMS client (see workflows/channels.ts — only whatsapp and email
# are built), so an sms entry silently resolves to nothing. Email is the honest
# second channel, and it is the one that survives a customer having no WhatsApp
# account at all.
#
# ── the ceiling ──
#
# The class ceiling was raised to `maxCustomerTouches: 4` (see cause-class.ts),
# so there is room for a later reminder. These ladders deliberately do not use
# it: two messages at the moment of failure, then silence. A third message about
# a typo is nagging, and adding one is a separate, deliberate decision.

- id: customer_input.default
  version: 1
  description: >
    Class-level ladder for a mistyped field. Opens immediately, closes quickly —
    two touches, because a third message about a typo is nagging.
  match:
    causeClass: [customer_input]
    attended: true
  ladder:
    - at: 0m
      action: nudge
      channels: [whatsapp, email]
      fanout: true
      intent: switch_method
      note: >
        Zero delay and BOTH channels at once. They are looking at the error
        right now; the WhatsApp lands on their phone and the same link is in
        their inbox before they have left the page.
  preconditions:
    [order_unpaid, no_live_attempt, consent_ok, not_quiet_hours, within_frequency_cap, channel_deliverable]
  abortOn: [order_paid, payment_link_paid, customer_optout, deadline_passed]
  maxMessages: 2
  holdoutEligible: true

- id: customer_input.incorrect_otp
  version: 1
  description: >
    Usually a late OTP rather than a wrong one. The first touch offers a straight
    retry; the second deliberately moves them off the card, because diagnose.ts
    withdraws same-instrument retry after two attempts and a third wrong OTP
    commonly locks the card at the issuer.
  match:
    errorReason: incorrect_otp
    causeClass: [customer_input]
    attended: true
  ladder:
    - at: 0m
      action: nudge
      channels: [whatsapp, email]
      fanout: true
      intent: switch_method
      suggest: [retry_same, upi_intent]
      note: >
        Both channels together. retry_same is offered here and only here — if
        the OTP fails again, diagnose.ts withdraws same-instrument retry before
        a third attempt can cost them the card.
  preconditions:
    [order_unpaid, no_live_attempt, consent_ok, not_quiet_hours, within_frequency_cap, channel_deliverable]
  abortOn: [order_paid, payment_link_paid, customer_optout, deadline_passed]
  maxMessages: 2
  holdoutEligible: true

- id: customer_input.incorrect_cvv
  version: 1
  description: A mistyped CVV — the single most recoverable failure we see.
  match:
    errorReason: incorrect_cvv
    causeClass: [customer_input]
    attended: true
  ladder:
    - at: 0m
      action: nudge
      channels: [whatsapp, email]
      fanout: true
      intent: switch_method
      suggest: [retry_same, upi_intent]
      note: Both channels together — a mistyped CVV is fixed in seconds or not at all.
  preconditions:
    [order_unpaid, no_live_attempt, consent_ok, not_quiet_hours, within_frequency_cap, channel_deliverable]
  abortOn: [order_paid, payment_link_paid, customer_optout, deadline_passed]
  maxMessages: 2
  holdoutEligible: true
